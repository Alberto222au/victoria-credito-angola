<title>Victoria Crédito Angola — Pedido</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050505;color:#fff}
.header{background:#000;padding:22px 15px;text-align:center;border-bottom:2px solid #FFD700}
.logo{font-size:23px;font-weight:800;color:#FFD700}
.subtitle{font-size:12px;color:#ddd;margin-top:7px}
.container{max-width:520px;margin:auto;padding:15px}
.card{background:#111;border:1px solid #5f5000;border-radius:16px;padding:20px;margin-bottom:15px}
h3{margin-top:0;color:#FFD700}
label{display:block;text-align:left;font-size:13px;margin:13px 2px 5px;color:#eee}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #6b5a00;background:#080808;color:#fff;font-size:15px}
.btn{width:100%;padding:15px;border:0;border-radius:10px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:bold;font-size:15px;cursor:pointer;margin-top:18px}
.note{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}
.summary{display:none;background:#181818;border:1px solid #806d00;border-radius:12px;padding:15px;margin-top:18px;text-align:left}
.summary strong{color:#FFD700}
.error{color:#ff7777;font-size:12px;margin-top:8px;display:none}
.success{display:none;background:#102313;border:1px solid #4caf50;color:#d8ffd8;padding:13px;border-radius:10px;margin-top:15px;font-size:13px}
</style>

</head>
