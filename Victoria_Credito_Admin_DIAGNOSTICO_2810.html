
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victoria Crédito Angola — Administração</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif;padding:15px}
header{text-align:center;color:#FFD700;font-size:22px;font-weight:bold;padding:20px 5px}
.sub{text-align:center;color:#ccc;margin-bottom:20px}
main{max-width:900px;margin:auto}
.card{background:#111;border:1px solid #FFD700;border-radius:12px;padding:18px;margin-bottom:18px}
h2{color:#FFD700;font-size:19px}
input{width:100%;padding:13px;margin:8px 0;background:white;color:#111;border:1px solid #aaa;border-radius:7px;font-size:16px}
button{padding:11px 14px;border:0;border-radius:7px;background:#FFD700;color:#111;font-weight:bold;margin:5px 3px;cursor:pointer}
button:disabled{opacity:.5}
.recusar{background:#e05252;color:white}
.aprovar{background:#36b36a;color:white}
.apagar{background:#777;color:white}
.whatsapp{background:#25D366;color:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#202020;padding:13px 5px;text-align:center;border-radius:8px}
.stat strong{display:block;color:#FFD700;font-size:23px}
.stat span{font-size:12px}
.pedido{background:#202020;border:1px solid #555;border-radius:9px;padding:14px;margin-top:12px;overflow-wrap:anywhere}
.estado{color:#FFD700;font-weight:bold}
#mensagem{margin:12px 0;overflow-wrap:anywhere}
.oculto{display:none}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>👑 VICTORIA CRÉDITO ANGOLA</header>
<div class="sub">Área administrativa</div>

<main>
<section class="card" id="login">
<h2>🔐 Acesso do administrador</h2>
<input id="email" type="email" placeholder="E-mail do administrador">
<input id="senha" type="password" placeholder="Palavra-passe">
<button id="entrar">ENTRAR</button>
<div id="msgLogin"></div>
</section>
