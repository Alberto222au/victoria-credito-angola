function alterarEstado(id, estado) {
  if (!db) return;

  db.collection("pedidos").doc(id).update({
    estado: estado.toLowerCase(),
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e => alert("Não foi possível alterar o estado: " + (e.message || e.code)));
}

function apagarPedido(id) {
  if (!confirm("Deseja apagar este pedido? Esta ação não pode ser desfeita.")) return;

  db.collection("pedidos").doc(id).delete()
    .catch(e => alert("Não foi possível apagar o pedido: " + (e.message || e.code)));
}

function limparTodos() {
  alert("Por segurança, a eliminação em massa está desativada. Apague apenas um pedido de cada vez.");
}

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}
