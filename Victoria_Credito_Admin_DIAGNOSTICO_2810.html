
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victoria Crédito Angola — Administração</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#050505;color:white;font-family:Arial,sans-serif}
header{text-align:center;color:#FFD700;font-size:22px;font-weight:bold;padding:18px 5px}
h2{color:#FFD700;text-align:center}
.card{background:#111;border:1px solid #FFD700;border-radius:15px;padding:15px;margin:15px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:15px}
input,select{background:#222;color:white;border:1px solid #777}
button{background:linear-gradient(90deg,#FFD700,#FFA500);color:#111;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secundario{background:#333;color:white;border:1px solid #FFD700}
.perigo{background:#8b0000;color:white}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#171717;border:1px solid #FFD700;border-radius:10px;padding:13px;text-align:center}
.stat strong{display:block;color:#FFD700;font-size:24px;margin-top:7px}
.pedido{background:#151515;border:1px solid #555;border-left:4px solid #FFD700;border-radius:10px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.pedido p{margin:8px 0}
.estado{color:#FFD700;font-weight:bold}
.acoes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}
.acoes button{margin:0}
.escondido{display:none}
#mensagem{text-align:center;padding:12px;color:#FFD700;overflow-wrap:anywhere}
.pequeno{font-size:13px;color:#bbb}
</style>
</head>
<body>

<header>👑 VICTORIA CRÉDITO ANGOLA</header>
<h2>Área administrativa</h2>

<div id="login" class="card">
  <h2>Entrar na administração</h2>
  <input id="email" type="email" placeholder="E-mail do administrador">
  <input id="senha" type="password" placeholder="Palavra-passe">
  <button id="entrar">ENTRAR</button>
  <div id="erroLogin" class="pequeno"></div>
</div>

<div id="painel" class="escondido">
  <div class="card">
    <p>Administrador autenticado.</p>
    <button id="sair" class="secundario">TERMINAR SESSÃO</button>
  </div>

  <h2>📊 Resumo dos pedidos</h2>
  <div class="stats">
    <div class="stat">Todos<strong id="total">0</strong></div>
    <div class="stat">Pendentes<strong id="pendentes">0</strong></div>
    <div class="stat">Aprovados<strong id="aprovados">0</strong></div>
    <div class="stat">Recusados<strong id="recusados">0</strong></div>
  </div>

  <div class="card">
    <h2>📋 Pedidos recebidos</h2>
    <input id="pesquisa" type="search" placeholder="Pesquisar nome ou telefone">
    <select id="filtro">
      <option value="todos">Todos os estados</option>
      <option value="pendente">Pendentes</option>
      <option value="aprovado">Aprovados</option>
      <option value="recusado">Recusados</option>
    </select>
    <div id="lista"></div>
  </div>
</div>

<div id="mensagem"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0EFrVMWXTZukRTeXOCoG6-VJNbAQ8rdE",
  authDomain: "victoria-credito-angola.firebaseapp.com",
  projectId: "victoria-credito-angola",
  appId: "1:259074645009:web:f2b5cfa34e4af15b3725b0"
};

const UID_ADMIN = "pV7eDfDDZVNPGESer9nYuqyBYJu1";
const el = id => document.getElementById(id);

let auth;
let db;
let pedidos = [];
let listener = null;

function mostrarMensagem(texto){
  el("mensagem").textContent = texto;
}

function normalizarEstado(estado){
  return String(estado || "").trim().toLowerCase();
}

function iniciarFirebase(){
  try{
    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }

    auth = firebase.auth();
    db = firebase.firestore();

    auth.onAuthStateChanged(function(user){
      if(user && user.uid === UID_ADMIN){
        el("login").classList.add("escondido");
        el("painel").classList.remove("escondido");
        carregarPedidos();
      }else{
        pararListener();
        el("painel").classList.add("escondido");
        el("login").classList.remove("escondido");

        if(user){
          auth.signOut();
          el("erroLogin").textContent =
            "Esta conta não tem autorização de administrador.";
        }
      }
    });

  }catch(erro){
    mostrarMensagem("Erro ao iniciar Firebase: " + erro.message);
  }
}

function entrar(){
  const email = el("email").value.trim();
  const senha = el("senha").value;

  if(!email || !senha){
    el("erroLogin").textContent =
      "Introduza o e-mail e a palavra-passe.";
    return;
  }

  el("entrar").disabled = true;
  el("erroLogin").textContent = "A verificar os dados...";

  auth.signInWithEmailAndPassword(email,senha)
    .then(function(){
      el("erroLogin").textContent = "";
    })
    .catch(function(erro){
      el("erroLogin").textContent =
        "Não foi possível entrar: " + (erro.code || erro.message);
    })
    .finally(function(){
      el("entrar").disabled = false;
    });
}

function pararListener(){
  if(listener){
    listener();
    listener = null;
  }
}

function carregarPedidos(){
  pararListener();
  mostrarMensagem("A carregar pedidos...");

  listener = db.collection("pedidos")
    .onSnapshot(function(snapshot){
      pedidos = snapshot.docs.map(function(doc){
        return {id:doc.id,...doc.data()};
      });

      pedidos.sort(function(a,b){
        const dataA = a.criadoEm && a.criadoEm.toMillis
          ? a.criadoEm.toMillis() : 0;
        const dataB = b.criadoEm && b.criadoEm.toMillis
          ? b.criadoEm.toMillis() : 0;
        return dataB - dataA;
      });

      atualizar();
      mostrarMensagem(
        pedidos.length ? "Pedidos atualizados." : "Nenhum pedido encontrado."
      );

    },function(erro){
      mostrarMensagem("Erro ao carregar pedidos: " +
        (erro.code || erro.message));
    });
}

function atualizar(){
  el("total").textContent = pedidos.length;
  el("pendentes").textContent =
    pedidos.filter(p => normalizarEstado(p.estado) === "pendente").length;
  el("aprovados").textContent =
    pedidos.filter(p => normalizarEstado(p.estado) === "aprovado").length;
  el("recusados").textContent =
    pedidos.filter(p => normalizarEstado(p.estado) === "recusado").length;

  renderizarPedidos();
}

function escapar(valor){
  return String(valor == null ? "" : valor).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"
    }[c];
  });
}

function formatarData(data){
  if(!data) return "Não indicada";
  try{
    const d = data.toDate ? data.toDate() : new Date(data);
    if(isNaN(d.getTime())) return "Não indicada";
    return d.toLocaleString("pt-PT");
  }catch(e){
    return "Não indicada";
  }
}

function renderizarPedidos(){
  const termo = el("pesquisa").value.trim().toLowerCase();
  const filtro = el("filtro").value;

  const encontrados = pedidos.filter(function(p){
    const estado = normalizarEstado(p.estado);
    const nome = String(p.nome || "").toLowerCase();
    const telefone = String(p.telefone || "").toLowerCase();

    const correspondeTexto =
      nome.includes(termo) || telefone.includes(termo);
    const correspondeEstado =
      filtro === "todos" || estado === filtro;

    return correspondeTexto && correspondeEstado;
  });

  if(!encontrados.length){
    el("lista").innerHTML =
      '<p class="pequeno">Nenhum pedido encontrado.</p>';
    return;
  }

  el("lista").innerHTML = encontrados.map(function(p){
    const estado = normalizarEstado(p.estado) || "não indicado";

    return `
      <div class="pedido">
        <p><strong>Cliente:</strong> ${escapar(p.nome)}</p>
        <p><strong>Telefone:</strong> ${escapar(p.telefone)}</p>
        <p><strong>Valor:</strong> ${escapar(p.valor)} Kz</p>
        <p><strong>Prazo:</strong> ${escapar(p.prazoDias)} dias</p>
        <p><strong>Rendimento:</strong> ${escapar(p.rendimento)} Kz</p>
        <p><strong>Finalidade:</strong> ${escapar(p.finalidade)}</p>
        <p><strong>Data:</strong> ${escapar(formatarData(p.criadoEm))}</p>
        <p class="estado">Estado: ${escapar(estado)}</p>
        <div class="acoes">
          <button data-acao="aprovado" data-id="${escapar(p.id)}">APROVAR</button>
          <button data-acao="pendente" data-id="${escapar(p.id)}">PENDENTE</button>
          <button data-acao="recusado" data-id="${escapar(p.id)}">RECUSAR</button>
          <button class="secundario" data-acao="whatsapp" data-id="${escapar(p.id)}">WHATSAPP</button>
          <button class="perigo" data-acao="apagar" data-id="${escapar(p.id)}">APAGAR</button>
        </div>
      </div>`;
  }).join("");
}

async function alterarEstado(id,estado){
  try{
    await db.collection("pedidos").doc(id).update({
      estado: estado
    });
    mostrarMensagem("Estado atualizado com sucesso!");
  }catch(erro){
    mostrarMensagem("Erro ao atualizar: " + (erro.code || erro.message));
  }
}

async function apagarPedido(id){
  if(!confirm("Tem a certeza de que deseja apagar este pedido?")){
    return;
  }

  try{
    await db.collection("pedidos").doc(id).delete();
    mostrarMensagem("Pedido apagado com sucesso.");
  }catch(erro){
    mostrarMensagem("Erro ao apagar: " + (erro.code || erro.message));
  }
}

function contactarWhatsApp(p){
  let telefone = String(p.telefone || "").replace(/\D/g,"");

  if(telefone.startsWith("0")){
    telefone = telefone.substring(1);
  }
  if(!telefone.startsWith("244")){
    telefone = "244" + telefone;
  }

  if(telefone.length < 11){
    mostrarMensagem("O telefone deste cliente não é válido.");
    return;
  }

  const texto =
    "Olá " + (p.nome || "cliente") +
    ", estamos a contactar sobre o seu pedido de crédito na Victoria Crédito Angola.";

  window.open(
    "https://wa.me/" + telefone + "?text=" + encodeURIComponent(texto),
    "_blank"
  );
}

el("entrar").addEventListener("click",entrar);

el("senha").addEventListener("keydown",function(e){
  if(e.key === "Enter") entrar();
});

el("sair").addEventListener("click",function(){
  pararListener();
  auth.signOut();
});

el("pesquisa").addEventListener("input",renderizarPedidos);
el("filtro").addEventListener("change",renderizarPedidos);

el("lista").addEventListener("click",function(e){
  const botao = e.target.closest("button[data-acao]");
  if(!botao) return;

  const id = botao.dataset.id;
  const acao = botao.dataset.acao;
  const pedido = pedidos.find(p => p.id === id);

  if(!pedido) return;

  if(["aprovado","pendente","recusado"].includes(acao)){
    alterarEstado(id,acao);
  }else if(acao === "apagar"){
    apagarPedido(id);
  }else if(acao === "whatsapp"){
    contactarWhatsApp(pedido);
  }
});

iniciarFirebase();
</script>
</body>
</html>
